apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: minipaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672   # protocole AMQP, utilisé par l'API/worker
            - containerPort: 15672  # interface d'administration web
          volumeMounts:
            # /var/lib/rabbitmq contient la base Mnesia : définitions des
            # queues/exchanges + messages non consommés déclarés "durable".
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: [ "rabbitmq-diagnostics", "-q", "ping" ]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # Déclaré une fois au niveau du pod, référencé par son nom
        # ("rabbitmq-data") dans volumeMounts ci-dessus.
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc