# Deployment (pas StatefulSet) : l'API est sans état, chaque pod est
# interchangeable. Toute donnée qui doit survivre vit dans Postgres/Redis/RabbitMQ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: minipaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: crud-go-api:latest
          # IfNotPresent (et non le défaut "Always" pour un tag :latest) :
          # cette image n'existe dans aucun registre, seulement importée
          # localement dans le cluster via `k3d image import`. Avec la
          # politique par défaut, kubelet tenterait de la re-tirer d'un
          # registre distant et échouerait (ImagePullBackOff).
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            # PORT, RABBITMQ_QUEUE (non sensibles)
            - configMapRef:
                name: app-config
            # DATABASE_URL, REDIS_ADDR, RABBITMQ_URL (contiennent des identifiants)
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            # Laisse le temps à l'API d'établir ses connexions Postgres/Redis/
            # RabbitMQ au démarrage avant d'activer readiness/liveness.
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            # /health vérifie aussi les dépendances (Postgres/Redis/RabbitMQ) :
            # si l'une d'elles tombe, l'API est retirée du Service (mais pas tuée).
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            # Volontairement PAS /health ici : un hoquet de Redis ferait
            # redémarrer l'API pour rien alors qu'elle est saine. tcpSocket
            # vérifie juste que le process répond encore sur son port
            # (pas figé/deadlock) sans dépendre de services externes.
            tcpSocket:
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
