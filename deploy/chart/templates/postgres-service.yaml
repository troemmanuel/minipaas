apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "minipaas.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "minipaas.selectorLabels" . | nindent 4 }}
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432