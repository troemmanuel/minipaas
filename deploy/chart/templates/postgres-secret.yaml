{{- /*
manageSecrets=false (values-dev.yaml/values-prod.yaml, utilisées par
ArgoCD) fait disparaître cette ressource du rendu Helm -- rien à ignorer
pour ArgoCD si elle n'existe pas dans la sortie. Plus fiable qu'une
annotation "Skip" (constaté : ignorée par un `argocd app sync` manuel).
Ses vraies valeurs viennent de values.secrets.yaml (absent de Git, F5),
et la ressource est provisionnée à la main jusqu'à l'étape 6 (Sealed Secrets).
*/}}
{{- if .Values.manageSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "minipaas.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
{{- end }}
