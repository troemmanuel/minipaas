apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "minipaas.labels" . | nindent 4 }}
  annotations:
    # ArgoCD ignore totalement cette ressource (ne la cree, ne la compare,
    # ne la supprime jamais) -- ses vraies valeurs viennent de
    # values.secrets.yaml, volontairement absent de Git (F5). Provisionnee
    # a la main jusqu'a l'etape 6 (Sealed Secrets).
    argocd.argoproj.io/sync-options: Skip=true
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}